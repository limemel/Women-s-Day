<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Весенняя Аура 2026</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.28);
            --card-border: rgba(255, 255, 255, 0.55);
            --text-main: #1f2937;
            --text-soft: #6b7280;
            --accent: #ec4899;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Manrope', sans-serif;
            color: var(--text-main);
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.45), transparent 35%),
                radial-gradient(circle at 80% 0%, rgba(250, 204, 21, 0.2), transparent 30%),
                radial-gradient(circle at 90% 85%, rgba(236, 72, 153, 0.22), transparent 35%);
        }

        body::after {
            background-image: linear-gradient(rgba(255, 255, 255, 0.14) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.14) 1px, transparent 1px);
            background-size: 24px 24px;
            mix-blend-mode: soft-light;
            opacity: 0.4;
        }

        .bg-orb {
            position: fixed;
            border-radius: 999px;
            filter: blur(70px);
            pointer-events: none;
            z-index: 1;
            animation: orb-float 9s ease-in-out infinite;
        }

        .orb-one {
            width: 360px;
            height: 360px;
            top: -120px;
            left: -100px;
            background: rgba(255, 255, 255, 0.45);
        }

        .orb-two {
            width: 330px;
            height: 330px;
            right: -90px;
            bottom: -100px;
            background: rgba(251, 191, 36, 0.35);
            animation-delay: 1.4s;
        }

        .orb-three {
            width: 220px;
            height: 220px;
            top: 40%;
            left: -70px;
            background: rgba(244, 114, 182, 0.24);
            animation-delay: 0.7s;
        }

        #main-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow:
                0 30px 70px rgba(17, 24, 39, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(14px);
        }

        .hero-badge {
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #be185d;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(244, 114, 182, 0.45);
            background: rgba(255, 255, 255, 0.62);
            box-shadow: 0 12px 25px rgba(236, 72, 153, 0.12);
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: #111827;
            text-wrap: balance;
        }

        .hero-subtitle {
            color: #374151;
            max-width: 30ch;
            margin-inline: auto;
            line-height: 1.55;
        }

        #scanner-zone {
            width: 220px;
            height: 220px;
            border-radius: 999px;
            position: relative;
            isolation: isolate;
        }

        #scanner-zone::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: inherit;
            background: conic-gradient(from 0deg, rgba(244, 114, 182, 0.7), rgba(251, 191, 36, 0.65), rgba(79, 70, 229, 0.65), rgba(244, 114, 182, 0.7));
            z-index: -1;
            filter: blur(10px);
            opacity: 0.58;
            animation: spin-slow 10s linear infinite;
        }

        #scanner-zone::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }

        #fingerprint-wrapper {
            width: 150px;
            height: 150px;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.2) 60%, rgba(249, 168, 212, 0.24) 100%);
            border: 1px solid rgba(255, 255, 255, 0.75);
            box-shadow:
                0 18px 38px rgba(236, 72, 153, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            overflow: hidden;
        }

        #scan-text {
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 700;
        }

        .result-chip {
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 0 16px 34px rgba(15, 23, 42, 0.12);
        }

        .result-quote {
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.42);
            box-shadow: 0 20px 35px rgba(15, 23, 42, 0.08);
        }

        #result-title {
            font-family: 'Playfair Display', serif;
            text-wrap: balance;
        }

        .floating-petal {
            position: absolute;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.5);
            filter: blur(1px);
            animation: petal-rise 7s linear infinite;
        }

        @keyframes spin-slow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes orb-float {
            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-16px);
            }
        }

        @keyframes petal-rise {
            0% {
                transform: translateY(0) scale(0.7);
                opacity: 0;
            }

            20% {
                opacity: 0.9;
            }

            100% {
                transform: translateY(-180px) scale(1.05);
                opacity: 0;
            }
        }

        @keyframes bounce-short {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15%);
            }
        }

        .animate-bounce-short {
            animation: bounce-short 1.5s ease-in-out infinite;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0px) scale(0.8);
                opacity: 0;
            }

            10% {
                transform: translateY(-50px) scale(0.9);
                opacity: 1;
            }

            100% {
                transform: translateY(-150vh) scale(1.2);
                opacity: 0;
            }
        }

        .animate-float-up {
            animation: float-up 5s linear infinite;
            animation-fill-mode: both;
        }

        .hidden-safelist {
            display: none;
        }

        @media (max-width: 420px) {
            #main-card {
                padding: 26px 20px;
                border-radius: 2rem;
            }

            #scanner-zone {
                width: 200px;
                height: 200px;
            }

            #fingerprint-wrapper {
                width: 138px;
                height: 138px;
            }

            .hero-title {
                font-size: 2rem;
                line-height: 1.1;
            }
        }
    </style>
</head>

    <script>

            { name: "Янтарный Блик", gradient: "from-amber-500 to-orange-500", bg: "from-amber-100 to-orange-200", text: "Год стабильности, накопления ресурсов и уверенности в завтрашнем дне. Твои прошлые старания наконец-то принесут щедрые дивиденды." },
            { name: "Лунный Камень", gradient: "from-blue-200 to-indigo-300", bg: "from-blue-50 to-indigo-100", text: "Год исполнения самого заветного, тайного желания. То, о чем ты молчала, начнет сбываться. Доверься потоку событий." },
            { name: "Небесная Лазурь", gradient: "from-sky-400 to-cyan-300", bg: "from-sky-100 to-cyan-200", text: "Абсолютная свобода! В этом году ты сбросишь все чужие ожидания и рамки. Только твои правила, только твой уникальный путь." },
            { name: "Гранатовый Сок", gradient: "from-red-600 to-rose-600", bg: "from-red-100 to-rose-200", text: "Год колоссальной жизненной силы и здоровья. У тебя будет столько энергии, что ты сможешь свернуть горы и вдохновить на это других." },
            { name: "Ванильное Небо", gradient: "from-pink-200 to-orange-200", bg: "from-pink-50 to-orange-100", text: "Год сладких моментов и бесконечных приятных сюрпризов. Жизнь будет баловать тебя мелочами, от которых на душе становится тепло." },
            { name: "Хрустальная Роса", gradient: "from-cyan-200 to-blue-200", bg: "from-cyan-50 to-blue-100", text: "Ясность ума и правильные решения. Ты четко поймешь, чего хочешь от жизни, и выстроишь идеальный план по достижению этого. Никаких сомнений!" },
            { name: "Перламутровая Раковина", gradient: "from-pink-100 to-purple-200", bg: "from-pink-50 to-purple-100", text: "В этом году ты откроешь в себе новую суперсилу. То, что раньше казалось твоей слабостью, станет твоим главным козырем и защитой." },
            { name: "Фиолетовый Космос", gradient: "from-purple-600 to-fuchsia-600", bg: "from-purple-200 to-fuchsia-300", text: "Время масштабных мечтаний! Мечтай по-крупному, потому что в этом году Вселенная настроена сказать тебе «Слушаю и повинуюсь»." },
            { name: "Искрящееся Шампанское", gradient: "from-yellow-200 to-amber-300", bg: "from-yellow-50 to-amber-100", text: "Праздник каждый день! Год будет полон поводов для радости, красивых нарядов и звона бокалов. Ты будешь сиять ярче всех." },
            { name: "Малиновый Щербет", gradient: "from-pink-500 to-rose-500", bg: "from-pink-100 to-rose-200", text: "Ты почувствуешь настоящий вкус к жизни! Новые увлечения, необычная еда, смелые решения в стиле. Год тотального кайфа." },
            { name: "Изумрудный Лес", gradient: "from-green-500 to-emerald-600", bg: "from-green-100 to-emerald-200", text: "Год заземления и связи с природой. Ты найдешь невероятный ресурс в прогулках, поездках за город и заботе о себе на глубоком физическом уровне." },
            { name: "Платиновый Луч", gradient: "from-gray-300 to-slate-400", bg: "from-gray-100 to-slate-200", text: "Твоя уникальность будет признана! Год, когда твои таланты заметят и оценят по достоинству. Ожидай крутых предложений." },
            { name: "Бронзовый Загар", gradient: "from-orange-400 to-amber-600", bg: "from-orange-100 to-amber-200", text: "Этот год обещает быть очень жарким на события. Незабываемый отдых, курортные романы (даже если с собственным мужем) и море ярких впечатлений." },
            { name: "Неоновая Мята", gradient: "from-teal-300 to-green-400", bg: "from-teal-50 to-green-100", text: "Дерзость и смелость! В этом году ты решишься на то, о чем раньше только думала. Выход из зоны комфорта принесет тебе оглушительный успех." }
        ];

        let isScanning = false;
        let progress = 0;
        let requestRef;
        let startTimeRef;
        let showResult = false;
        let lastVibeProgress = 0;
        const SCAN_DURATION = 3000;

        const scannerZone = document.getElementById('scanner-zone');
        const filledFingerprint = document.getElementById('filled-fingerprint');
        const laserLine = document.getElementById('laser-line');
        const pulse1 = document.getElementById('pulse-1');
        const pulse2 = document.getElementById('pulse-2');
        const fingerprintWrapper = document.getElementById('fingerprint-wrapper');
        const scanText = document.getElementById('scan-text');

        const scanScreen = document.getElementById('scan-screen');
        const resultScreen = document.getElementById('result-screen');
        const mainBg = document.getElementById('main-bg');

        const triggerVibe = (pattern) => {
            try {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                }
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(pattern);
                } else if (window.navigator && window.navigator.webkitVibrate) {
                    window.navigator.webkitVibrate(pattern);
                } else if (window.navigator && window.navigator.mozVibrate) {
                    window.navigator.mozVibrate(pattern);
                } else if (window.navigator && window.navigator.msVibrate) {
                    window.navigator.msVibrate(pattern);
                }
            } catch(e) {}
        };

        const requestFullscreen = () => {
            try {
                const elem = document.documentElement;
                if (!document.fullscreenElement) {
                    if (elem.requestFullscreen) {
                        elem.requestFullscreen().catch(e => {});
                    } else if (elem.webkitRequestFullscreen) {
                        elem.webkitRequestFullscreen().catch(e => {});
                    } else if (elem.mozRequestFullScreen) {
                        elem.mozRequestFullScreen().catch(e => {});
                    } else if (elem.msRequestFullscreen) {
                        elem.msRequestFullscreen().catch(e => {});
                    }
                }
            } catch (e) {}
        };

        const forceFullscreenOnStart = () => {
            requestFullscreen();
            let attempts = 0;
            const maxAttempts = 8;
            const retry = () => {
                if (document.fullscreenElement || attempts >= maxAttempts) return;
                attempts += 1;
                requestFullscreen();
                setTimeout(retry, 250);
            };
            retry();
        };

        forceFullscreenOnStart();
        window.addEventListener('load', forceFullscreenOnStart);
        document.addEventListener('DOMContentLoaded', forceFullscreenOnStart);

        const enableFullscreenOnFirstTouch = () => {
            requestFullscreen();
            document.removeEventListener('touchstart', enableFullscreenOnFirstTouch);
            document.removeEventListener('click', enableFullscreenOnFirstTouch);
        };
        document.addEventListener('touchstart', enableFullscreenOnFirstTouch, {passive: true});
        document.addEventListener('click', enableFullscreenOnFirstTouch);

        const generateHearts = () => {
            const container = document.getElementById('hearts-container');
            container.innerHTML = '';
            container.classList.remove('hidden');

            for (let i = 0; i < 25; i++) {
                const heart = document.createElement('div');
                heart.className = 'absolute animate-float-up';
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.bottom = `-50px`;
                heart.style.width = `${Math.random() * 15 + 15}px`;
                heart.style.height = `${Math.random() * 15 + 15}px`;
                heart.style.animationDelay = `${Math.random() * 2}s`;
                heart.style.animationDuration = `${Math.random() * 4 + 4}s`;
                heart.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" class="w-full h-full text-pink-300 drop-shadow-[0_0_8px_rgba(244,114,182,0.8)]"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
                container.appendChild(heart);
            }
        };

        const showResultView = (index) => {
            showResult = true;
            const prediction = AURA_PREDICTIONS[index];

            document.getElementById('result-title').textContent = prediction.name;
            document.getElementById('result-title').className = `text-4xl font-extrabold mb-6 text-transparent bg-clip-text bg-gradient-to-r ${prediction.gradient} drop-shadow-sm z-10 relative text-center leading-tight`;
            document.getElementById('result-text').textContent = prediction.text;

            mainBg.className = `transition-colors duration-1000 ease-in-out bg-gradient-to-br ${prediction.bg} min-h-screen w-full flex items-center justify-center p-4 overflow-hidden relative`;

            scanScreen.classList.add('hidden');
            scanScreen.classList.remove('flex');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');

            generateHearts();
        };

        const init = () => {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                }
            } catch(e) {}
            // const savedIndex = localStorage.getItem('springAuraResultIndex');
            // if (savedIndex !== null) {
            //     showResultView(parseInt(savedIndex, 10));
            // }
        };

        const triggerFinishVibe = () => {
            try {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
            } catch(e) {}
            triggerVibe([120, 60, 220]);
        };

        const animateProgress = (timestamp) => {
            if (!startTimeRef) startTimeRef = timestamp;
            const elapsed = timestamp - startTimeRef;

            progress = Math.min((elapsed / SCAN_DURATION) * 100, 100);

            if (progress - lastVibeProgress >= 5) {
                triggerVibe(15);
                lastVibeProgress = progress;
            }

            filledFingerprint.style.clipPath = `inset(${100 - progress}% 0 0 0)`;
            if(progress > 0 && progress < 100) {
                laserLine.classList.remove('hidden');
                laserLine.style.bottom = `${progress}%`;
            } else {
                laserLine.classList.add('hidden');
            }

            if (progress < 100) {
                requestRef = requestAnimationFrame(animateProgress);
            } else {
                finishScanning();
            }
        };

        const startScanning = (e) => {
            if (e && e.preventDefault && e.type !== 'mousedown') e.preventDefault();
            if (showResult) return;

            requestFullscreen();
            triggerVibe(50);
            isScanning = true;
            progress = 0;
            lastVibeProgress = 0;
            startTimeRef = null;

            pulse1.classList.remove('hidden');
            pulse2.classList.remove('hidden');
            fingerprintWrapper.classList.replace('scale-100', 'scale-95');

            scanText.textContent = 'Считываем линии...';
            scanText.classList.replace('text-gray-500', 'text-pink-600');
            scanText.classList.replace('opacity-70', 'opacity-100');

            requestRef = requestAnimationFrame(animateProgress);
        };

        const stopScanning = () => {
            if (!isScanning || progress >= 100) return;

            isScanning = false;
            cancelAnimationFrame(requestRef);
            progress = 0;

            filledFingerprint.style.clipPath = `inset(100% 0 0 0)`;
            laserLine.classList.add('hidden');
            pulse1.classList.add('hidden');
            pulse2.classList.add('hidden');
            fingerprintWrapper.classList.replace('scale-95', 'scale-100');

            scanText.textContent = 'Нажми и удерживай';
            scanText.classList.replace('text-pink-600', 'text-gray-500');
            scanText.classList.replace('opacity-100', 'opacity-70');
        };

        const finishScanning = () => {
            isScanning = false;
            triggerFinishVibe();

            const randomIndex = Math.floor(Math.random() * AURA_PREDICTIONS.length);

            // localStorage.setItem('springAuraResultIndex', randomIndex.toString());

            setTimeout(() => {
                showResultView(randomIndex);
            }, 600);
        };

        scannerZone.addEventListener('mousedown', startScanning);
        scannerZone.addEventListener('touchstart', startScanning, {passive: false});

        window.addEventListener('mouseup', stopScanning);
        window.addEventListener('touchend', stopScanning);
        scannerZone.addEventListener('mouseleave', stopScanning);

        document.addEventListener('contextmenu', event => event.preventDefault());

        init();
    </script>
</body>
</html>
